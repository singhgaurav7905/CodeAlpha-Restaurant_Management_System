spring.application.name=restaurant-management

# ---- Database (PostgreSQL) ----
# Create the database first: `createdb restaurant_db` (or via psql: CREATE DATABASE restaurant_db;)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- Initial staff account ----
# Used only when the staff_users table is empty. Change the password after first login.
app.seed.admin.username=${ADMIN_USERNAME}
app.seed.admin.password=${ADMIN_PASSWORD}

# ddl-auto=update creates/updates tables automatically from the JPA entities on startup.
# Fine for dev; for production prefer a migration tool (Flyway/Liquibase) and set this to "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

# Serve static site (index.html, admin.html, login.html) from /
spring.web.resources.static-locations=classpath:/static/

# Restaurant-wide operating settings used by services
restaurant.reservation.slot-minutes=90
restaurant.table.cleaning-minutes=15
restaurant.reservation.no-show-grace-minutes=30
