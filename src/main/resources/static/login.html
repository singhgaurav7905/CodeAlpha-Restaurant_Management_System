<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Staff sign in — Ember &amp; Row</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .login-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-wrap { width: 100%; max-width: 380px; }
  .login-wrap .eyebrow { justify-content: center; }
  .login-wrap h2 { text-align: center; }
</style>
</head>
<body>
<div class="login-shell">
  <div class="login-wrap">
    <div style="text-align:center;margin-bottom:28px">
      <a href="/index.html" class="brand" style="justify-content:center">Ember<span>&amp;</span>Row</a>
    </div>
    <form class="form-card" method="post" action="/perform_login">
      <div class="eyebrow">Staff only</div>
      <h2>Sign in</h2>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" required autofocus placeholder="staff username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required placeholder="password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      <div class="form-msg show err" id="login-error" style="display:none">That username or password isn't right.</div>
    </form>
    <p style="text-align:center;margin-top:18px;font-size:13px"><a href="/index.html" style="color:var(--brass-bright)">&larr; Back to the site</a></p>
  </div>
</div>
<script>
  if (new URLSearchParams(window.location.search).get("error") === "true") {
    document.getElementById("login-error").style.display = "block";
  }
</script>
</body>
</html>
